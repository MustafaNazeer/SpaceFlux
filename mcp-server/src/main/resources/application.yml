spring:
  application:
    name: mcp-server
  main:
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: spaceflux-tools
        version: 0.1.0
        # Each POST is answered on its own: no session, no server sent event stream, nothing kept between calls
        # (ADR 0015, decision 3).
        protocol: STATELESS
        type: SYNC
        stdio: false
        instructions: >-
          Read only tools over SpaceFlux, a demonstration built on public CelesTrak element sets and NOAA SWPC
          space weather data. It is not an operational collision avoidance or space weather warning system.
        tool-change-notification: false
        # The tools are the read tools in ReadTools and nothing else: no annotated methods, no resources, prompts
        # or completions.
        annotation-scanner:
          enabled: false
        capabilities:
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

spaceflux:
  mcp:
    # Inside Compose; query-api's port on the internal tools network.
    query-api-url: ${QUERY_API_URL:http://query-api:8080}
    # The Compose secret holding the token callers present.
    token-file: ${MCP_TOKEN_FILE:/run/secrets/mcp_server_token}
    calls-per-minute: 30
