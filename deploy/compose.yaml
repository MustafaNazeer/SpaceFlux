# Local development stack. Run from the repository root:
#   docker compose -f deploy/compose.yaml --profile core up --build
# Broker settings follow Apache's single node plaintext example for apache/kafka 4.3.1.
name: spaceflux

# Docker's json-file driver keeps every line by default, so a fault that logs in a loop could fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  kafka:
    profiles: [core]
    logging: *logging
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The image default is a 1 GiB heap; the measured live heap was about
      # 178 MiB (docs/perf/local-memory.md).
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Topics are provisioned here rather than by ingest. One partition is a
  # provisional local value until consumer lag has been measured.
  topics:
    profiles: [core]
    logging: *logging
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in raw.gp raw.gp.dlq raw.swpc raw.swpc.dlq alerts alerts.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1 || exit 1
        done
    restart: "no"

  ingest:
    profiles: [core]
    logging: *logging
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:19092
      # Set INGEST_FEEDS=swpc to restart without a new CelesTrak request.
      INGEST_FEEDS: ${INGEST_FEEDS:-celestrak,swpc}
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  risk-engine:
    profiles: [core]
    logging: *logging
    build:
      context: ..
      dockerfile: risk-engine/Dockerfile
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:19092
      # snappy (ingest's producer default) and zstd unpack a native library
      # before loading it, so they get an exec tmpfs of their own and /tmp
      # stays noexec. The risk engine checks every codec at startup.
      JAVA_TOOL_OPTIONS: -Dorg.xerial.snappy.tempdir=/native -DZstdTempFolder=/native
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /native:exec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Passwords are files in deploy/secrets/, written once by deploy/mysql/make-secrets.sh.
  # The account script in mysql/initdb runs only when the data volume is empty.
  mysql:
    profiles: [core]
    logging: *logging
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # Without this the image also creates root@'%', reachable from every container on the network.
      MYSQL_ROOT_HOST: localhost
      # Sessions use the numeric offset +00:00, so the named time zone tables are never read.
      MYSQL_INITDB_SKIP_TZINFO: "1"
      MYSQL_DATABASE: spaceflux
      MYSQL_MIGRATE_USER: spaceflux_migrate
      MYSQL_CONSUMER_USER: spaceflux_consumer
      MYSQL_API_USER: spaceflux_api
    secrets: [mysql_root_password, mysql_migrate_password, mysql_consumer_password, mysql_api_password]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d/spaceflux.cnf:/etc/mysql/conf.d/spaceflux.cnf:ro
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    # No published port, and only services on the database network reach it.
    networks: [database]
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    # The image's own mysql user, which owns the data directories, so the entrypoint needs no capability.
    user: "999:999"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The temporary server that runs the account script listens on no TCP port, so this
    # passes only once the real server is up. mysqladmin ping exits 0 even when access is denied.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    profiles: [core]
    logging: *logging
    build:
      context: ..
      dockerfile: db-migrate/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MIGRATE_HOST: mysql
      MIGRATE_USER: spaceflux_migrate
      CONSUMER_USER: spaceflux_consumer
      API_USER: spaceflux_api
    secrets: [mysql_migrate_password]
    networks: [database]
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  query-api:
    profiles: [core]
    logging: *logging
    build:
      context: ..
      dockerfile: query-api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      CONSUMER_USER: spaceflux_consumer
      API_USER: spaceflux_api
      KAFKA_BROKERS: kafka:19092
      # The operator who may acknowledge alerts, from deploy/.env (git ignored). The hash is bcrypt, single quoted
      # there so Compose keeps its $ characters; with either value empty nobody can sign in and reads still work.
      ACK_OPERATOR_USERNAME: ${ACK_OPERATOR_USERNAME:-}
      ACK_OPERATOR_PASSWORD_HASH: ${ACK_OPERATOR_PASSWORD_HASH:-}
      # Never empty: an empty value would replace the service's default and fail to start it.
      ACK_OPERATOR_BCRYPT_COST: ${ACK_OPERATOR_BCRYPT_COST:-14}
      # Local only: the demo environment leaves GraphQL introspection at its default, off (ADR 0012).
      GRAPHQL_INTROSPECTION: "true"
      # As for risk-engine: snappy and zstd unpack a native library, so they get an exec tmpfs of their own
      # and /tmp stays noexec. query-api checks every codec at startup.
      JAVA_TOOL_OPTIONS: -Dorg.xerial.snappy.tempdir=/native -DZstdTempFolder=/native
    # Never the migration password: only the migrate container holds it.
    secrets: [mysql_consumer_password, mysql_api_password]
    # The database network reaches MySQL; the default network reaches Kafka.
    networks: [database, default]
    # Loopback only, so the API can be called from this machine and nowhere else.
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /native:exec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

networks:
  default:
  # No route out: nothing on it needs the internet. query-api also joins default for Kafka.
  database:
    internal: true

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_migrate_password:
    file: ./secrets/mysql_migrate_password
  mysql_consumer_password:
    file: ./secrets/mysql_consumer_password
  mysql_api_password:
    file: ./secrets/mysql_api_password

volumes:
  kafka-data:
  mysql-data:
