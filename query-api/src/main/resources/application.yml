# Database settings follow ADR 0010 and the dat items of docs/security/hardening-checklist.md; Kafka settings follow
# ADR 0008 and ADR 0010. The broker address comes from KAFKA_BROKERS; plaintext is for the local stack only.
# Passwords are read only from the Compose secret files, as a config tree: the file mysql_api_password
# becomes the property mysql_api_password. The service refuses to start if any other source sets either one.
spring:
  config:
    import: optional:configtree:${QUERY_API_SECRETS:/run/secrets/}
  flyway:
    enabled: false
  # Responses use the contracts' field names and leave out a field with no value (ADR 0010, amendment).
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_absent
  web:
    resources:
      # No static content is served, so an unknown path reaches the API's 404 problem body.
      add-mappings: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        allow.auto.create.topics: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    listener:
      # The offset of each record is committed once the listener returns for it.
      ack-mode: record

spaceflux:
  alerts:
    enabled: ${SPACEFLUX_ALERTS_ENABLED:true}
  catalog:
    enabled: ${SPACEFLUX_CATALOG_ENABLED:true}
  mysql:
    host: ${MYSQL_HOST:mysql}
    port: ${MYSQL_PORT:3306}
    database: spaceflux
    ssl-mode: ${MYSQL_SSL_MODE:REQUIRED}
    consumer:
      username: ${CONSUMER_USER:spaceflux_consumer}
    api:
      username: ${API_USER:spaceflux_api}
  # The one operator who may acknowledge alerts (ADR 0009, decision 2). The hash is bcrypt, generated offline, in
  # the delegating encoder's form ({bcrypt}...). With either value missing nobody can sign in and every read works.
  operator:
    username: ${ACK_OPERATOR_USERNAME:}
    password-hash: ${ACK_OPERATOR_PASSWORD_HASH:}
    # The cost of every check; the hash must be made at exactly this cost.
    bcrypt-cost: ${ACK_OPERATOR_BCRYPT_COST:12}

# The API's own error controller answers on /error; these pin Boot's defaults as a backstop, so a later change
# cannot start returning a trace or a message from the error path (SEC-API-08).
server:
  # The operator's session (ADR 0009, decision 1). The ID travels only in this cookie, never in a URL (SEC-API-13).
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: SPACEFLUX_SESSION
        secure: true
        http-only: true
        same-site: strict
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
